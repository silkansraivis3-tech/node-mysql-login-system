<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/messages.js"></script>
</head>
<body>
  <div class="auth-card">
      <h1>Register</h1>
      <div class="auth-message"></div>
  <form class="register-form" action="/register" method="POST">
    <div class="register-user-name">
    <label>Username:</label>
    <input type="text" name="username" required>
    </div>
    <div class="register-email">
    <label>Email:</label>
    <input type="email" name="email" required>
    </div>
    <div class="register-password">
    <label>Password:</label>
    <input type="password" name="password" required>
    </div>
    <button class="register-login-btn" type="submit">Register</button>
  </form>
  <p>Already have an account?</p>
  <a class="login-register-here" href="/login.html">Login here</a>
  </div>
  <a class="return-home" href="index.html">Return to homepage</a>
</body>
</html>
