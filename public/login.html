<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/messages.js"></script>
</head>
<body>
  <div class="auth-card">
      <h1>Login</h1>
    <div class="auth-message"></div>
  <form class="login-form" action="/login" method="POST">
    <div class="login-email">
      <label>Email:</label>
      <input type="email" name="email" required>
    </div>
    <div class="login-pw">
      <label>Password:</label>
      <input type="password" name="password" required>
    </div>

    <button class="register-login-btn" type="submit">Login</button>
  </form>
  <p>No account?</p>
    <a class="login-register-here" href="/register.html">Register here</a>
  </div>
  <a class="return-home" href="index.html">Return to homepage</a>
</body>
</html>
